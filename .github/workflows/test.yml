name: Test guest display tooling
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no GPU required)
        run: python3 -m unittest discover -s tests -v
      - name: Syntax and staged installation
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile src/idd.py
          cp src/idd.py /tmp/idd-check.py
          python3 /tmp/idd-check.py probe --help
          stage=$(mktemp -d)
          bash scripts/install.sh --guest-only --destdir "$stage"
          cmp src/idd.py "$stage/usr/local/bin/idd"
          test -x "$stage/usr/local/bin/idd"
          test -f "$stage/etc/udev/rules.d/71-idd-hotplug.rules"
          cmp config/modes.json "$stage/etc/idd/modes.json"
          echo '{"keep":"my edited configuration"}' > "$stage/etc/idd/modes.json"
          bash scripts/install.sh --guest-only --destdir "$stage"
          grep -q 'my edited configuration' "$stage/etc/idd/modes.json"
          sudo install -m755 src/idd.py /usr/local/bin/idd
          systemd-analyze verify systemd/idd-display.service
      - name: Independently decode generated EDID
        run: |
          sudo apt-get update
          sudo apt-get install -y edid-decode
          python3 src/idd.py edid /tmp/idd.edid
          edid-decode --check /tmp/idd.edid
          python3 src/idd.py edid /tmp/idd-modes.edid --modes config/modes.json
          edid-decode --check /tmp/idd-modes.edid
          python3 - <<'PY'
          import json
          from pathlib import Path
          default = json.loads(Path('config/modes.json').read_text())
          samples = {
              'preferred': dict(default, preferred='2560x1440@144'),
              'fractional': {'preferred': '1920x1080@59.94', 'modes': [
                  {'width': 1920, 'height': 1080, 'refresh_rates': [59.94]},
                  {'width': 3440, 'height': 1440, 'refresh_rates': [100]}]},
              'many': {'preferred': '1920x1080@60', 'modes': [
                  {'width': 1920, 'height': 1080, 'refresh_rates': [60]},
                  {'width': 3840, 'height': 2160, 'refresh_rates': list(range(83, 106))}]},
          }
          for name, profile in samples.items():
              Path('/tmp/idd-' + name + '.json').write_text(json.dumps(profile))
          PY
          for sample in preferred fractional many; do
            python3 src/idd.py edid "/tmp/idd-$sample.edid" --modes "/tmp/idd-$sample.json"
            edid-decode --check "/tmp/idd-$sample.edid"
          done
